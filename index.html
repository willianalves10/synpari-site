<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Synpari</title>
  <meta name="description" content="Shared expenses, made simple." />
  <meta name="theme-color" content="#F6F5F1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 420'%3E%3Ccircle cx='210' cy='210' r='165' fill='%230B6B61'/%3E%3Ccircle cx='390' cy='210' r='165' fill='%23A7DED0'/%3E%3Cpath d='M300 71.7A165 165 0 0 1 300 348.3A165 165 0 0 1 300 71.7Z' fill='%23083F3A'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@500;700;800&display=swap" />
  <style>
    :root { --pine: #0E5A52; --deep: #0B3F39; --mint: #E4EFEB; --paper: #F6F5F1; --ink: #15171C; --slate: #5B6068; --line: #E7E5DF; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink);
           font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 72px 20px 40px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .mark { width: 120px; height: auto; }
    .word { font-size: 22px; font-weight: 800; letter-spacing: -0.6px; margin-top: 10px; }
    h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: clamp(40px, 8vw, 64px); line-height: 1.02; letter-spacing: -1px; margin: 40px 0 16px; text-wrap: balance; }
    p { color: var(--slate); font-size: 18px; line-height: 1.5; margin: 0; max-width: 46ch; }
    .soon { margin-top: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: var(--mint); color: var(--deep); font-weight: 700; font-size: 15px; }
    footer { padding: 24px 20px 32px; text-align: center; font-size: 14px; color: var(--slate); }
    footer a { color: var(--pine); font-weight: 700; text-decoration: none; margin: 0 8px; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 600 420" fill="none" aria-hidden="true">
      <circle cx="210" cy="210" r="165" fill="#0B6B61" />
      <circle cx="390" cy="210" r="165" fill="#A7DED0" />
      <path d="M300 71.7A165 165 0 0 1 300 348.3A165 165 0 0 1 300 71.7Z" fill="#083F3A" />
    </svg>
    <div class="word">Synpari</div>
    <h1 id="tagline">Shared expenses, made simple.</h1>
    <p id="lede">Organize the bills you share with your partner, roommates or family: who pays what, what is still pending and how much you spent together.</p>
    <span class="soon" id="soon">Coming soon to Google Play</span>
  </main>
  <footer>
    © <span id="year">2026</span> Synpari ·
    <a href="/privacy/" id="lk-privacy">Privacy policy</a>
    <a href="/delete-account/" id="lk-delete">Delete account</a>
  </footer>
  <script>
    (function () {
      var T = {
        en: { tagline: "Shared expenses, made simple.", lede: "Organize the bills you share with your partner, roommates or family: who pays what, what is still pending and how much you spent together.", soon: "Coming soon to Google Play", privacy: "Privacy policy", del: "Delete account" },
        pt: { tagline: "Despesas compartilhadas, sem complicação.", lede: "Organize as contas que você divide com quem mora ou convive com você: quem paga o quê, o que ainda falta pagar e quanto vocês gastaram juntos.", soon: "Em breve na Google Play", privacy: "Política de privacidade", del: "Excluir conta" },
        es: { tagline: "Gastos compartidos, sin complicaciones.", lede: "Organiza las cuentas que compartes con tu pareja, compañeros de piso o familia: quién paga qué, qué falta por pagar y cuánto gastaron juntos.", soon: "Próximamente en Google Play", privacy: "Política de privacidad", del: "Eliminar cuenta" }
      };
      var lang = (navigator.language || "en").slice(0, 2);
      var t = T[lang] || T.en;
      document.documentElement.lang = lang;
      document.getElementById("tagline").textContent = t.tagline;
      document.getElementById("lede").textContent = t.lede;
      document.getElementById("soon").textContent = t.soon;
      document.getElementById("lk-privacy").textContent = t.privacy;
      document.getElementById("lk-delete").textContent = t.del;
      document.getElementById("year").textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
