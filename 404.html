<!doctype html>
<!--
  Serves every unknown path on GitHub Pages (and /join/ itself: join/index.html is a copy of this file; keep them equal).
  /join/CODE shows the invite; anything else shows "page not found".

  - Android: tries to open the app (synpari://); if it is not installed, shows the code, "Copy code" and the Google Play
    button. The Play link carries referrer=invite_code%3DCODE, so the app, on its first launch, reads the Play Install
    Referrer and pre-fills the code. App Links (assetlinks.json) open the app directly when it is already installed.
  - iPhone: NEVER tries synpari:// on its own (it shows an error when the app is missing). Shows the code, "Copy code" and
    the App Store button; "Open in the app" is a button the person taps. The app does not read the clipboard.
  - Desktop: both store buttons.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Synpari</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { --pine: #0E5A52; --deep: #0B3F39; --mint: #E4EFEB; --paper: #F6F5F1; --ink: #15171C; --slate: #5B6068; --line: #E7E5DF; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
           background: var(--paper); color: var(--ink); font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 420px; text-align: center; }
    .logo { width: 88px; height: auto; margin: 0 auto 8px; display: block; }
    h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 36px; line-height: 1.1; margin: 8px 0; letter-spacing: -0.4px; }
    p { color: var(--slate); font-size: 16px; line-height: 1.45; margin: 8px 0; }
    .code { display: block; margin: 18px 0 6px; padding: 18px 22px; background: #fff; border: 2px solid var(--pine); border-radius: 20px;
            font-size: 44px; font-weight: 800; letter-spacing: 8px; color: var(--deep); user-select: all; -webkit-user-select: all; }
    .btn { display: block; width: 100%; margin-top: 12px; padding: 16px; border: 0; border-radius: 16px; font-family: inherit; font-size: 16px; font-weight: 800; text-align: center; text-decoration: none; cursor: pointer; }
    .primary { background: var(--pine); color: #fff; }
    .secondary { background: var(--mint); color: var(--deep); }
    .step { margin-top: 18px; font-size: 14px; font-weight: 700; color: var(--deep); }
    .hint { font-size: 13px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 600 420" fill="none" aria-hidden="true">
      <circle cx="210" cy="210" r="165" fill="#0B6B61" />
      <circle cx="390" cy="210" r="165" fill="#A7DED0" />
      <path d="M300 71.7A165 165 0 0 1 300 348.3A165 165 0 0 1 300 71.7Z" fill="#083F3A" />
    </svg>

    <h1 id="title">You were invited to Synpari</h1>
    <p id="subtitle">Opening the app...</p>

    <div id="fallback" hidden>
      <p id="fallback-text">Your invite code:</p>
      <div class="code" id="code" aria-live="polite">------</div>
      <button type="button" class="btn secondary" id="copy">Copy code</button>

      <p class="step" id="step">Install the app</p>
      <a class="btn primary" id="play" href="#" hidden>Get it on Google Play</a>
      <a class="btn primary" id="ios" href="#" hidden>Download on the App Store</a>

      <a class="btn secondary" id="open" href="#">Open in the app</a>
      <p class="hint" id="hint">Then open Synpari and tap "I have an invite code".</p>
    </div>
  </main>

  <script>
    (function () {
      var PLAY_URL = "https://play.google.com/store/apps/details?id=com.synpariapp.synpari";
      var IOS_URL = "https://apps.apple.com/app/id6823784562";
      var T = {
        en: { notFound: "Page not found", title: "You were invited to Synpari", opening: "Opening the app...", fallback: "Your invite code:", copy: "Copy code", copied: "Code copied", step: "Install the app", open: "Open in the app", play: "Get it on Google Play", ios: "Download on the App Store", hintAndroid: "The code is filled in when you open the app. If it isn't, tap \"I have an invite code\" and paste it.", hintIos: "Then open Synpari, tap \"I have an invite code\" and paste the code you copied.", hintOther: "Then open Synpari on your phone, tap \"I have an invite code\" and type the code." },
        pt: { notFound: "Página não encontrada", title: "Você foi convidado para o Synpari", opening: "Abrindo o app...", fallback: "Seu código de convite:", copy: "Copiar código", copied: "Código copiado", step: "Instale o app", open: "Abrir no app", play: "Disponível no Google Play", ios: "Baixar na App Store", hintAndroid: "O código já vem preenchido ao abrir o app. Se não vier, toque em \"Tenho um código de convite\" e cole.", hintIos: "Depois abra o Synpari, toque em \"Tenho um código de convite\" e cole o código que você copiou.", hintOther: "Depois abra o Synpari no celular, toque em \"Tenho um código de convite\" e digite o código." },
        es: { notFound: "Página no encontrada", title: "Te invitaron a Synpari", opening: "Abriendo la app...", fallback: "Tu código de invitación:", copy: "Copiar código", copied: "Código copiado", step: "Instala la app", open: "Abrir en la app", play: "Disponible en Google Play", ios: "Descargar en la App Store", hintAndroid: "El código ya aparece escrito al abrir la app. Si no, toca \"Tengo un código de invitación\" y pégalo.", hintIos: "Luego abre Synpari, toca \"Tengo un código de invitación\" y pega el código que copiaste.", hintOther: "Luego abre Synpari en tu celular, toca \"Tengo un código de invitación\" y escribe el código." }
      };
      var lang = (navigator.language || "en").slice(0, 2);
      var t = T[lang] || T.en;
      var ua = navigator.userAgent || "";
      var isAndroid = /Android/i.test(ua);
      var isIos = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);

      function el(id) { return document.getElementById(id); }

      // The code is the last path segment: /join/ABC123
      var parts = location.pathname.split("/").filter(Boolean);
      if (parts[0] !== "join") { el("title").textContent = t.notFound; el("subtitle").innerHTML = "<a href=\"/\">synpariapp.com</a>"; return; }
      var code = decodeURIComponent(parts[parts.length - 1] || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (code.length > 12) code = code.slice(0, 12);

      document.documentElement.lang = lang;
      el("title").textContent = t.title;
      el("subtitle").textContent = t.opening;
      el("fallback-text").textContent = t.fallback;
      el("copy").textContent = t.copy;
      el("step").textContent = t.step;
      el("open").textContent = t.open;
      el("play").textContent = t.play;
      el("ios").textContent = t.ios;
      el("code").textContent = code || "------";

      // Play: the code travels through the installation (Play Install Referrer). "invite_code=CODE", URL-encoded once.
      el("play").href = code ? PLAY_URL + "&referrer=" + encodeURIComponent("invite_code=" + code) : PLAY_URL;
      el("ios").href = IOS_URL;
      el("open").href = "synpari://join/" + encodeURIComponent(code);

      if (isAndroid) { el("play").hidden = false; el("hint").textContent = t.hintAndroid; }
      else if (isIos) { el("ios").hidden = false; el("hint").textContent = t.hintIos; }
      else { el("play").hidden = false; el("ios").hidden = false; el("hint").textContent = t.hintOther; }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
        return new Promise(function (resolve, reject) {
          var ta = document.createElement("textarea");
          ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy") ? resolve() : reject(); } catch (e) { reject(e); } finally { document.body.removeChild(ta); }
        });
      }
      el("copy").addEventListener("click", function () {
        var btn = el("copy");
        copyText(code).then(function () {
          btn.textContent = t.copied;
          setTimeout(function () { btn.textContent = t.copy; }, 2000);
        }, function () {
          // Could not copy: select the code so the person can copy it by hand.
          var range = document.createRange(); range.selectNodeContents(el("code"));
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
        });
      });

      function showFallback() {
        el("subtitle").hidden = true;
        el("fallback").hidden = false;
      }

      if (!code) { showFallback(); return; }

      // Only Android tries the custom scheme by itself. On an iPhone without the app it shows an error, and on a computer it
      // does nothing: those show the page right away (the iPhone person taps "Open in the app" if the app is installed).
      if (!isAndroid) { showFallback(); return; }
      var started = Date.now();
      window.location.href = "synpari://join/" + encodeURIComponent(code);
      setTimeout(function () {
        // Still here after 1.5s: the app did not take over.
        if (Date.now() - started < 4000) showFallback();
      }, 1500);
    })();
  </script>
</body>
</html>
